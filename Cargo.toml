[package]
name = "openmoody"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
regex = "1.13.1"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
rand = "0.10.4"
sha2 = "0.11.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
reqwest = "0.13.5"
html-escape = "0.3.1"
base64 = "0.23.1"
subtle = "2.6.1"
zip = "9.6.0"
csscolorparser = "0.9.2"
